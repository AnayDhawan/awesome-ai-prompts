name: Feature Request
description: Suggest a new prompt, improvement, or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! We welcome new prompts, improvements to existing ones, and other enhancements to make this collection even better.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem are you trying to solve, or what workflow would you like to improve? Describe the challenge you're facing.
      placeholder: "I'm trying to [do X], but currently [struggle with Y]..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see added or changed? Be as specific as possible - a new prompt idea, modifications to an existing prompt, new category, etc.
      placeholder: "I'd like to add a prompt for [use case] that helps with [goal]..."
    validations:
      required: true
  - type: textarea
    id: benefits
    attributes:
      label: Expected Benefits
      description: How would this help you or others in the community? Who would benefit from this addition?
      placeholder: "This would help developers by..."
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches or existing prompts that might partially address this need? If so, why isn't that sufficient?
      placeholder: "I looked at [existing prompt X], but..."
    validations:
      required: false
  - type: textarea
    id: examples
    attributes:
      label: Examples or Inspiration
      description: Share examples, similar prompts from other sources, mockups, or any references that would help us understand your vision better.
      placeholder: "For inspiration, [link or description]..."
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else you'd like us to know - implementation ideas, edge cases, or related discussions.
      placeholder: "Add any other context here..."
    validations:
      required: false
