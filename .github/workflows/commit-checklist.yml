name: Commit checklist

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Consistency checks
        run: |
          set -o pipefail
          bash scripts/check-consistency.sh | tee "$GITHUB_STEP_SUMMARY"

      - name: Conventional commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|ci|chore)(\(.+\))?!?:\ .+ ]]; then
            echo "PR title OK: $PR_TITLE"
          else
            echo "PR title does not follow Conventional Commits: $PR_TITLE"
            echo "Expected format: type(scope)?: description"
            echo "Types: feat | fix | docs | style | refactor | perf | test | ci | chore"
            exit 1
          fi
